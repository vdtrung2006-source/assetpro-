<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}</style>
<title>AssetPro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: fixed navy sidebar + content column, mirrors Hình 4.1–4.4 of the report. Collapses to top bar on phones. */
:root{
  --bg:#f5f7fb; --surface:#ffffff; --surface2:#f8fafc; --line:#dbe3ee;
  --fg:#1b2a41; --muted:#5f6f86; --navy:#1e3a5f; --navy-fg:#ffffff; --navy-hover:#2b4c78;
  --accent:#2563eb; --accent-fg:#ffffff; --accent-soft:#e6eefc;
  --ok:#0a8f63; --ok-bg:#dcf5ea; --warn:#b45f06; --warn-bg:#fdeccf; --bad:#c0362c; --bad-bg:#fbe0dd; --gray-bg:#e8ecf2;
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1724; --surface:#17212f; --surface2:#1b2738; --line:#2c3a4f;
  --fg:#e6edf7; --muted:#97a6bc; --navy:#0b1422; --navy-fg:#e6edf7; --navy-hover:#1c2b44;
  --accent:#5b8def; --accent-fg:#0b1422; --accent-soft:#1d2d4d;
  --ok:#4cd3a0; --ok-bg:#13392d; --warn:#f0b35a; --warn-bg:#41300f; --bad:#ff8d82; --bad-bg:#44201c; --gray-bg:#25324a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1724; --surface:#17212f; --surface2:#1b2738; --line:#2c3a4f;
  --fg:#e6edf7; --muted:#97a6bc; --navy:#0b1422; --navy-fg:#e6edf7; --navy-hover:#1c2b44;
  --accent:#5b8def; --accent-fg:#0b1422; --accent-soft:#1d2d4d;
  --ok:#4cd3a0; --ok-bg:#13392d; --warn:#f0b35a; --warn-bg:#41300f; --bad:#ff8d82; --bad-bg:#44201c; --gray-bg:#25324a; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* login */
.login-wrap{min-height:100vh;display:flex;flex-direction:column}
.topbar{background:var(--navy);color:var(--navy-fg);padding:12px max(16px,env(safe-area-inset-left,0px));font-weight:700;font-size:18px;display:flex;align-items:center;gap:12px}
.topbar .logo{width:40px;height:40px}
.login-body{flex:1;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.login-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);padding:28px;display:flex;flex-direction:column;gap:16px}
.login-card h1{font-size:18px;color:var(--navy);text-align:center;letter-spacing:.02em}
:root[data-theme="dark"] .login-card h1{color:var(--fg)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .login-card h1{color:var(--fg)}}
.demo{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.demo small{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface2);padding:5px 10px;cursor:pointer;font-size:12.5px;border-radius:4px}
.chip:hover{border-color:var(--accent);color:var(--accent)}

/* forms */
label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
label b{color:var(--bad)}
.inp,select.inp,textarea.inp{width:100%;padding:8px 10px;background:var(--surface2);border:1px solid var(--line);border-radius:3px}
.inp.err{border-color:var(--bad)}
.errmsg{color:var(--bad);font-size:12px;margin-top:3px}
.btn{background:var(--accent);color:var(--accent-fg);border:1px solid var(--accent);padding:8px 16px;cursor:pointer;border-radius:3px;font-weight:600}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--muted);border-color:var(--line)}
.btn.ghost:hover{color:var(--fg);border-color:var(--muted)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:3px 8px;font-size:12px;font-weight:500}
.field{margin-bottom:14px;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}

/* shell */
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.side{background:var(--navy);color:var(--navy-fg);padding:18px 10px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{font-size:20px;font-weight:700;padding:0 10px 16px;display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:50%;flex:none;background:#fff}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{color:inherit;text-decoration:none;padding:10px;border-radius:3px;opacity:.9}
.nav a:hover{background:var(--navy-hover)}
.nav a.on{background:var(--accent);color:var(--accent-fg);opacity:1}
.side .who{margin-top:auto;padding:10px;font-size:12px;opacity:.75}
.main{min-width:0;display:flex;flex-direction:column}
.head{background:var(--surface);border-bottom:1px solid var(--line);padding:16px max(20px,env(safe-area-inset-right,0px)) 16px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.head h1{font-size:19px;color:var(--navy)}
:root[data-theme="dark"] .head h1{color:var(--fg)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .head h1{color:var(--fg)}}
.head .user{color:var(--muted);font-size:13px}
.head .user button{background:none;border:0;color:var(--accent);cursor:pointer;padding:0}
.content{padding:20px max(20px,env(safe-area-inset-right,0px)) 40px 24px;display:flex;flex-direction:column;gap:20px;min-width:0}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}
.stat{background:var(--surface);border:1px solid var(--line);padding:14px 16px;border-left:4px solid var(--c)}
.stat span{color:var(--muted);font-size:12.5px}
.stat strong{display:block;font-size:24px;margin-top:2px}
.panel{background:var(--surface);border:1px solid var(--line);min-width:0}
.panel > h2{font-size:14px;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel .pad{padding:16px}
.cols{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12.5px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td.num{white-space:nowrap}
table{min-width:760px}
.acts{display:flex;gap:4px;flex-wrap:wrap}
.empty{padding:28px;text-align:center;color:var(--muted)}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.t-IN_USE{background:var(--ok-bg);color:var(--ok)}
.t-AVAILABLE{background:var(--accent-soft);color:var(--accent)}
.t-REPAIR{background:var(--warn-bg);color:var(--warn)}
.t-DISPOSED{background:var(--gray-bg);color:var(--muted)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap}
.toolbar .inp{width:auto;flex:1 1 200px;max-width:360px}
.toolbar select.inp{flex:0 0 auto}
.bar{display:grid;grid-template-columns:90px 1fr 36px;gap:10px;align-items:center;margin-bottom:8px;font-size:13px}
.bar i{display:block;height:10px;background:var(--accent);border-radius:2px}
.alert{display:flex;justify-content:space-between;gap:10px;padding:9px 16px;border-bottom:1px solid var(--line);font-size:13px}
.alert:last-child{border-bottom:0}
.muted{color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.on{color:var(--accent);border-color:var(--accent);font-weight:600}
.sess-row select{padding:3px 6px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.timeline li{padding-left:12px;border-left:2px solid var(--line);font-size:13px}

/* modal + toast */
.ov{position:fixed;inset:0;background:rgba(8,14,24,.55);display:grid;place-items:start center;overflow:auto;padding:5vh 16px;z-index:20}
.modal{background:var(--surface);border:1px solid var(--line);width:100%;max-width:720px;padding:22px 24px}
.modal.sm{max-width:440px}
.modal h2{font-size:17px;color:var(--navy);margin-bottom:16px}
:root[data-theme="dark"] .modal h2{color:var(--fg)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .modal h2{color:var(--fg)}}
.mfoot{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:var(--navy-fg);padding:10px 18px;border-radius:4px;z-index:30;max-width:90vw;box-shadow:0 4px 16px rgba(0,0,0,.3)}
#toast.bad{background:var(--bad);color:#fff}

@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px 12px;gap:6px}
  .brand{padding:0 10px 0 4px}
  .nav{flex-direction:row;flex-wrap:wrap}
  .side .who{display:none}
  .cols{grid-template-columns:1fr}
  .content,.head{padding-left:16px}
  .grid2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){.btn,.chip,.nav a{transition:background .15s,border-color .15s}}
</style>

<div id="app"></div>
<div id="modal" hidden></div>
<div id="toast" hidden></div>

/* Khấu hao đường thẳng: nguyên giá / (số năm × 12) mỗi tháng */
function dep(a,asOf=new Date()){
  const life=CATS[a.cat]*12, p=new Date(a.date);
  let el=(asOf.getFullYear()-p.getFullYear())*12+asOf.getMonth()-p.getMonth()-(asOf.getDate()<p.getDate()?1:0);
  el=Math.max(0,Math.min(life,el));
  const monthly=a.cost/life;
  return {life,el,monthly,yearly:monthly*12,acc:monthly*el,remain:a.cost-monthly*el,left:life-el};
}

  const cats=Object.keys(CATS).map(c=>[c,live.filter(a=>a.cat===c).length]);

  const recent=[...db.assets].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
  const warn=live.map(a=>({a,d:dep(a)})).filter(x=>x.d.left<=6).sort((x,y)=>x.d.left-y.d.left);
  const open=db.requests.filter(r=>r.state==='open');
  return `<div class="stats">
    <div class="stat" style="--c:#3b82f6"><span>Tổng tài sản</span><strong class="num">${db.assets.length}</strong></div>
    <div class="stat" style="--c:#10b981"><span>Đang sử dụng</span><strong class="num">${cnt('IN_USE')}</strong></div>
    <div class="stat" style="--c:#f59e0b"><span>Chờ bảo trì</span><strong class="num">${cnt('REPAIR')}</strong></div>
    <div class="stat" style="--c:#8b5cf6"><span>Giá trị tổng</span><strong class="num">${short(total)}</strong></div></div>
  <div class="panel"><h2>Tài sản gần đây</h2><div class="tablewrap"><table><thead><tr><th>Mã TS</th><th>Tên tài sản</th><th>Loại</th><th>Người sử dụng</th><th>Trạng thái</th></tr></thead><tbody>
    ${recent.map(a=>`<tr><td class="num">${a.code}</td><td>${esc(a.name)}</td><td>${a.cat}</td><td>${a.userId?esc(empName(a.userId)):esc(a.loc||'—')}</td><td>${tag(a.status)}</td></tr>`).join('')}</tbody></table></div></div>
  <div class="cols">
    <div class="panel"><h2>Cảnh báo khấu hao (còn ≤ 6 tháng)</h2>${warn.length?warn.map(x=>`<div class="alert"><span>${esc(x.a.name)} <span class="muted num">${x.a.code}</span></span><b class="num" style="color:${x.d.left?'var(--warn)':'var(--bad)'}">${x.d.left?'còn '+x.d.left+' tháng':'đã hết khấu hao'}</b></div>`).join(''):'<div class="empty">Chưa có tài sản nào sắp hết khấu hao.</div>'}</div>
    <div class="panel"><h2>Số lượng theo danh mục</h2><div class="pad">${cats.map(([c,n])=>`<div class="bar"><span>${c}</span><span><i style="width:${n/mx*100}%"></i></span><b class="num">${n}</b></div>`).join('')}</div></div></div>
  ${can.manage()?`<div class="panel"><h2>Yêu cầu bảo trì từ nhân viên (${open.length} chờ xử lý)</h2>${open.length?open.map(r=>`<div class="alert"><span><b>${r.code}</b> · ${esc(empName(r.by))}: ${esc(r.note)}</span><button class="btn sm" data-act="acceptReq" data-id="${r.id}">Tiếp nhận</button></div>`).join(''):'<div class="empty">Không có yêu cầu nào đang chờ.</div>'}</div>`:''}`;
}
function filtered(){
  const q=filt.q.trim().toLowerCase();
  return db.assets.filter(a=>(!q||a.code.toLowerCase().includes(q)||a.name.toLowerCase().includes(q))&&(!filt.cat||a.cat===filt.cat)&&(!filt.st||a.status===filt.st));
}
function assetRows(){
  const rows=filtered();
  if(!rows.length)return `<div class="empty">Không tìm thấy tài sản phù hợp.</div>`;
  return `<table><thead><tr><th>Mã TS</th><th>Tên tài sản</th><th>Danh mục</th><th>Ngày mua</th><th class="r">Giá trị</th><th>Người dùng</th><th>TT</th><th>Thao tác</th></tr></thead><tbody>${rows.map(a=>`<tr>
    <td class="num">${a.code}</td><td>${esc(a.name)}</td><td>${a.cat}</td><td class="num">${fmtDate(a.date)}</td><td class="r num">${short(a.cost)}</td>
    <td>${a.userId?esc(empName(a.userId)):'—'}</td><td>${tag(a.status)}</td>
    <td><div class="acts"><button class="btn ghost sm" data-act="view" data-c="${a.code}">Xem</button>${
      a.status==='DISPOSED'?'':`<button class="btn ghost sm" data-act="edit" data-c="${a.code}">Sửa</button>`+
      (a.status==='AVAILABLE'?`<button class="btn ghost sm" data-act="assign" data-c="${a.code}">Gán</button>`:'')+
      (a.status==='IN_USE'?`<button class="btn ghost sm" data-act="recall" data-c="${a.code}">Thu hồi</button>`:'')+
      (a.status==='REPAIR'?`<button class="btn ghost sm" data-act="fixed" data-c="${a.code}">Hoàn tất BT</button>`:'')+
      (can.dispose()?`<button class="btn ghost sm" data-act="dispose" data-c="${a.code}">Thanh lý</button>`:'')}</div></td></tr>`).join('')}</tbody></table>`;

    <select class="inp" id="fc"><option value="">Mọi danh mục</option>${Object.keys(CATS).map(c=>`<option ${filt.cat===c?'selected':''}>${c}</option>`).join('')}</select>
    <select class="inp" id="fs"><option value="">Mọi trạng thái</option>${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${filt.st===k?'selected':''}>${v}</option>`).join('')}</select>
    <button class="btn" data-act="add">+ Thêm mới</button></div>

function employees(){

  <div class="panel"><div class="tablewrap"><table><thead><tr><th>Họ tên</th><th>Phòng ban</th><th>Email</th><th class="r">Đang giữ</th><th>Thao tác</th></tr></thead><tbody>
  ${db.employees.map(e=>{const n=db.assets.filter(a=>a.userId===e.id&&a.status==='IN_USE').length;return `<tr><td>${esc(e.name)}</td><td>${esc(e.dept)}</td><td>${esc(e.email)}</td><td class="r num">${n}</td><td><button class="btn ghost sm" data-act="delEmp" data-id="${e.id}">Xóa</button></td></tr>`}).join('')}</tbody></table></div></div>`;
}
function inventory(){
  const act=db.sessions.find(s=>s.open);
  const past=db.sessions.filter(s=>!s.open).reverse();
  let h='';
  if(!act) h+=`<div class="panel"><div class="pad"><p class="muted" style="margin:0 0 12px">Chưa có phiên kiểm kê đang mở. Phiên mới gồm mọi tài sản chưa thanh lý, số sổ sách mặc định là 1.</p><button class="btn" data-act="newSession">Tạo phiên kiểm kê</button></div></div>`;
  else{
    const miss=act.items.filter(i=>i.actual===0).length, left=act.items.filter(i=>i.actual===null).length;
    h+=`<div class="panel"><h2>${esc(act.name)} <span class="muted">· ${left} chưa ghi nhận · ${miss} thiếu</span></h2><div class="tablewrap"><table><thead><tr><th>Mã TS</th><th>Tên tài sản</th><th class="r">Sổ sách</th><th>Thực tế</th><th>Chênh lệch</th></tr></thead><tbody>
    ${act.items.map((i,ix)=>{const a=byCode(i.code);const d=i.actual===null?null:i.actual-i.book;return `<tr><td class="num">${i.code}</td><td>${esc(a.name)}</td><td class="r num">${i.book}</td>
    <td><select class="inp sess-row" style="width:auto" data-ix="${ix}"><option value="" ${i.actual===null?'selected':''}>Chưa kiểm</option><option value="1" ${i.actual===1?'selected':''}>Có (1)</option><option value="0" ${i.actual===0?'selected':''}>Không thấy (0)</option></select></td>
    <td>${d===null?'—':d===0?'<span class="tag t-IN_USE">Khớp</span>':`<span class="tag t-REPAIR">Thiếu ${-d}</span>`}</td></tr>`}).join('')}</tbody></table></div>
    <div class="pad"><button class="btn" data-act="closeSession">Đóng phiên kiểm kê</button></div></div>`;
  }
  if(past.length) h+=`<div class="panel"><h2>Lịch sử các phiên kiểm kê</h2>${past.map(s=>{const m=s.items.filter(i=>i.actual===0);return `<div class="alert"><span>${esc(s.name)}</span><span>${s.items.length} tài sản · <b style="color:${m.length?'var(--bad)':'var(--ok)'}">${m.length?'thiếu '+m.length+': '+m.map(i=>i.code).join(', '):'khớp toàn bộ'}</b></span></div>`}).join('')}</div>`;
  return h;
}
function reports(){
  const live=db.assets.filter(a=>a.status!=='DISPOSED');
  const rows=live.map(a=>({a,d:dep(a)}));
  const T=k=>rows.reduce((s,r)=>s+r.d[k],0);
  let body;
  if(tab==='dep') body=`<div class="tablewrap"><table><thead><tr><th>Mã TS</th><th>Tên tài sản</th><th class="r">Nguyên giá</th><th class="r">Thời gian</th><th class="r">KH tháng</th><th class="r">KH năm</th><th class="r">Hao mòn lũy kế</th><th class="r">Giá trị còn lại</th></tr></thead><tbody>
    ${rows.map(({a,d})=>`<tr><td class="num">${a.code}</td><td>${esc(a.name)}</td><td class="r num">${vnd(a.cost)}</td><td class="r num">${CATS[a.cat]} năm</td><td class="r num">${vnd(d.monthly)}</td><td class="r num">${vnd(d.yearly)}</td><td class="r num">${vnd(d.acc)}</td><td class="r num"><b>${vnd(d.remain)}</b></td></tr>`).join('')}
    <tr><td colspan="2"><b>Tổng cộng</b></td><td class="r num"><b>${vnd(live.reduce((s,a)=>s+a.cost,0))}</b></td><td></td><td class="r num"><b>${vnd(T('monthly'))}</b></td><td class="r num"><b>${vnd(T('yearly'))}</b></td><td class="r num"><b>${vnd(T('acc'))}</b></td><td class="r num"><b>${vnd(T('remain'))}</b></td></tr></tbody></table></div>
    <div class="pad muted">Phương pháp đường thẳng: khấu hao kỳ = nguyên giá ÷ thời gian sử dụng hữu ích. Tính đến ${fmtDate(today())}.</div>`;
  else{
    const g=k=>Object.entries(db.assets.reduce((m,a)=>(m[k(a)]=(m[k(a)]||0)+1,m),{}));
    const sec=(t,arr)=>{const mx=Math.max(1,...arr.map(x=>x[1]));return `<div class="pad"><h3 style="font-size:13px;margin-bottom:10px">${t}</h3>${arr.map(([n,c])=>`<div class="bar"><span>${n}</span><span><i style="width:${c/mx*100}%"></i></span><b class="num">${c}</b></div>`).join('')}</div>`};
    body=sec('Theo trạng thái',g(a=>STATUS[a.status]))+sec('Theo danh mục',g(a=>a.cat))+sec('Theo phòng ban người dùng',g(a=>a.userId?emp(a.userId).dept:'Chưa gán'));
  }
  return `<div class="panel"><div class="tabs"><button class="${tab==='dep'?'on':''}" data-act="tab" data-t="dep">Sổ khấu hao</button><button class="${tab==='stat'?'on':''}" data-act="tab" data-t="stat">Thống kê</button></div>${body}</div>`;
}

  ${USERS.map(u=>`<tr><td>${u.email}</td><td>${ROLES[u.role]}</td><td class="muted">${MENU[u.role].map(m=>m[1]).join(', ')}</td></tr>`).join('')}</tbody></table></div></div>
  <div class="panel"><h2>Nhật ký thao tác gần đây</h2>${db.audit.length?db.audit.slice(0,10).map(l=>`<div class="alert"><span>${esc(l.t)}</span><span class="muted">${esc(l.u)} · ${fmtDate(l.d)}</span></div>`).join(''):'<div class="empty">Chưa có thao tác nào. Thử gán hoặc thu hồi một tài sản.</div>'}</div>

    <div class="field"><label for="rc">Tài sản <b>*</b></label><select class="inp" id="rc">${my.map(a=>`<option value="${a.code}">${a.code} · ${esc(a.name)}</option>`).join('')||'<option value="">Không có tài sản phù hợp</option>'}</select></div>
    <div class="field"><label for="rn">Mô tả sự cố <b>*</b></label><textarea class="inp" id="rn" rows="3" placeholder="Ví dụ: màn hình bị nhấp nháy"></textarea><div class="errmsg" id="rerr"></div></div>
    <button class="btn" type="submit">Gửi yêu cầu</button></form></div>

/* ===== Modals ===== */
function modal(html,sm){const m=$('#modal');m.innerHTML=`<div class="ov" data-act="ovclose"><div class="modal ${sm?'sm':''}" role="dialog" aria-modal="true">${html}</div></div>`;m.hidden=false}
function closeModal(){$('#modal').hidden=true;$('#modal').innerHTML=''}
function confirmBox(title,text,act,data,label='Xác nhận',danger=true){
  modal(`<h2>${title}</h2><p>${text}</p><div class="mfoot"><button class="btn ${danger?'danger':''}" data-act="${act}" ${Object.entries(data||{}).map(([k,v])=>`data-${k}="${esc(v)}"`).join(' ')}>${label}</button><button class="btn ghost" data-act="close">Hủy</button></div>`,true);
}
function fld(id,label,req,inner,err){return `<div class="field"><label for="${id}">${label}${req?' <b>*</b>':''}</label>${inner}${err?`<div class="errmsg">${err}</div>`:''}</div>`}
function assetForm(v={},er={},editCode){
  const inp=(id,ph,type='text')=>`<input class="inp ${er[id]?'err':''}" id="f_${id}" type="${type}" placeholder="${ph}" value="${esc(v[id]??'')}">`;
  const sel=(id,ph,opts)=>`<select class="inp ${er[id]?'err':''}" id="f_${id}"><option value="">${ph}</option>${opts.map(([val,l])=>`<option value="${esc(val)}" ${v[id]===val?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
  return `<h2>${editCode?'Sửa tài sản '+editCode:'Thêm tài sản mới'}</h2><form id="assetForm" data-edit="${editCode||''}" novalidate><div class="grid2">
    ${fld('f_code','Mã tài sản',1,inp('code','TS-2024-006 (tự động)'),er.code)}
    ${fld('f_name','Tên tài sản',1,inp('name','Nhập tên tài sản'),er.name)}
    ${fld('f_cat','Danh mục',1,sel('cat','Chọn danh mục',Object.keys(CATS).map(c=>[c,c+' ('+CATS[c]+' năm)'])),er.cat)}
    ${fld('f_date','Ngày mua',1,inp('date','dd/mm/yyyy','date'),er.date)}
    ${fld('f_cost','Giá trị mua (VNĐ)',1,inp('cost','0 VNĐ','number'),er.cost)}
    ${fld('f_sup','Nhà cung cấp',0,sel('sup','Chọn NCC',SUPPLIERS.map(s=>[s,s])))}
    ${fld('f_loc','Vị trí',0,inp('loc','Tầng 3 - Phòng IT'))}
    ${editCode?'':fld('f_userId','Người sử dụng',0,sel('userId','Chọn nhân viên',db.employees.map(e=>[e.id,e.name])))}
    </div>${fld('f_desc','Mô tả',0,`<textarea class="inp" id="f_desc" rows="2" placeholder="Ghi chú thêm...">${esc(v.desc||'')}</textarea>`)}
    <div class="mfoot"><button class="btn" type="submit">Lưu</button><button class="btn ghost" type="button" data-act="close">Hủy</button></div></form>`;
}
function detail(a){
  const d=dep(a);
  return `<h2>${esc(a.name)}</h2><dl class="kv"><dt>Mã tài sản</dt><dd class="num">${a.code}</dd><dt>Danh mục</dt><dd>${a.cat}</dd><dt>Trạng thái</dt><dd>${tag(a.status)}</dd>
  <dt>Người sử dụng</dt><dd>${a.userId?esc(empName(a.userId)):'—'}</dd><dt>Vị trí</dt><dd>${esc(a.loc||'—')}</dd><dt>Nhà cung cấp</dt><dd>${esc(a.sup||'—')}</dd><dt>Ngày mua</dt><dd>${fmtDate(a.date)}</dd>
  <dt>Nguyên giá</dt><dd class="num">${vnd(a.cost)}</dd><dt>Khấu hao</dt><dd class="num">${vnd(d.monthly)}/tháng · ${vnd(d.yearly)}/năm (${CATS[a.cat]} năm)</dd><dt>Giá trị còn lại</dt><dd class="num"><b>${vnd(d.remain)}</b> (${d.left} tháng còn lại)</dd>${a.desc?`<dt>Mô tả</dt><dd>${esc(a.desc)}</dd>`:''}</dl>
  <h3 style="margin:18px 0 8px;font-size:14px">Lịch sử</h3><ul class="timeline">${[...a.history].reverse().map(h=>`<li><span class="muted num">${fmtDate(h.d)}</span> · ${esc(h.t)}</li>`).join('')}</ul>
  <div class="mfoot" style="margin-top:16px"><button class="btn ghost" data-act="close">Đóng</button></div>`;
}

/* ===== Render ===== */
function render(){
  const app=$('#app');
  if(!user){app.innerHTML=loginView();return}
  if(!MENU[user.role].some(m=>m[0]===route))route=MENU[user.role][0][0];
  const v={dashboard,assets,employees,inventory,reports,config,mine,requests}[route];
  app.innerHTML=shell(v());
}
function go(){const h=location.hash.slice(1);if(h)route=h;render();scrollTo(0,0)}
addEventListener('hashchange',go);

/* ===== Events ===== */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]'); if(!t)return;
  const act=t.dataset.act, c=t.dataset.c, a=c&&byCode(c);
  if(act==='ovclose'){ if(e.target===t)closeModal(); return }
  switch(act){
    case 'quick': {const u=USERS.find(x=>x.email===t.dataset.e);$('#em').value=u.email;$('#pw').value=u.pw;$('#loginForm').requestSubmit();break}
    case 'logout': user=null;location.hash='';render();break;
    case 'close': closeModal();break;
    case 'tab': tab=t.dataset.t;render();break;
    case 'add': modal(assetForm({code:nextCode(),date:today()}));break;
    case 'edit': modal(assetForm(a,{},a.code));break;
    case 'view': modal(detail(a));break;
    case 'assign': modal(`<h2>Gán tài sản ${a.code}</h2><div class="field"><label for="as_emp">Người nhận <b>*</b></label><select class="inp" id="as_emp"><option value="">Chọn nhân viên</option>${db.employees.map(e=>`<option value="${e.id}">${esc(e.name)} · ${esc(e.dept)}</option>`).join('')}</select><div class="errmsg" id="as_err"></div></div><div class="mfoot"><button class="btn" data-act="doAssign" data-c="${a.code}">Gán tài sản</button><button class="btn ghost" data-act="close">Hủy</button></div>`,true);break;
    case 'doAssign': {const id=$('#as_emp').value;if(!id){$('#as_err').textContent='Chọn người nhận trước khi gán.';break}
      if(a.status!=='AVAILABLE'){toast('Tài sản đang được sử dụng, cần thu hồi trước (TC-ASSIGN-02)',1);break}
      a.status='IN_USE';a.userId=id;log(a,'Gán cho '+empName(id));save();closeModal();render();toast('Đã gán '+a.code+' cho '+empName(id));break}
    case 'recall': confirmBox('Thu hồi tài sản',`Thu hồi ${a.code} từ ${esc(empName(a.userId))}? Tài sản chuyển về trạng thái Sẵn sàng.`,'doRecall',{c:a.code},'Thu hồi');break;
    case 'doRecall': log(a,'Thu hồi từ '+empName(a.userId));a.userId=null;a.status='AVAILABLE';save();closeModal();render();toast('Đã thu hồi '+a.code);break;
    case 'fixed': a.status=a.userId?'IN_USE':'AVAILABLE';log(a,'Hoàn tất bảo trì');save();render();toast('Đã hoàn tất bảo trì '+a.code);break;
    case 'dispose': confirmBox('Thanh lý tài sản',`Thanh lý ${a.code} - ${esc(a.name)}? Thao tác này không hoàn tác được.`,'doDispose',{c:a.code},'Thanh lý');break;
    case 'doDispose': if(!can.dispose()){toast('Chỉ Admin hoặc Manager được thanh lý',1);break}
      log(a,'Thanh lý tài sản');a.status='DISPOSED';a.userId=null;save();closeModal();render();toast('Đã thanh lý '+a.code);break;
    case 'acceptReq': {const r=db.requests.find(x=>x.id==t.dataset.id);r.state='done';const x=byCode(r.code);x.status='REPAIR';log(x,'Tiếp nhận yêu cầu bảo trì: '+r.note);save();render();toast('Đã chuyển '+r.code+' sang bảo trì');break}
    case 'addEmp': modal(`<h2>Thêm nhân viên</h2><form id="empForm" novalidate>${fld('e_name','Họ tên',1,'<input class="inp" id="e_name">')}${fld('e_dept','Phòng ban',1,'<input class="inp" id="e_dept">')}${fld('e_mail','Email',0,'<input class="inp" id="e_mail" type="email">')}<div class="errmsg" id="e_err"></div><div class="mfoot"><button class="btn" type="submit">Lưu</button><button class="btn ghost" type="button" data-act="close">Hủy</button></div></form>`,true);break;
    case 'delEmp': {const n=db.assets.filter(x=>x.userId===t.dataset.id&&x.status==='IN_USE').length;
      if(n){toast('Nhân viên đang giữ '+n+' tài sản, hãy thu hồi trước',1);break}
      confirmBox('Xóa nhân viên',`Xóa ${esc(empName(t.dataset.id))} khỏi hệ thống?`,'doDelEmp',{id:t.dataset.id},'Xóa');break}
    case 'doDelEmp': db.employees=db.employees.filter(x=>x.id!==t.dataset.id);save();closeModal();render();toast('Đã xóa nhân viên');break;
    case 'newSession': {const d=new Date();db.sessions.push({open:true,name:`Kiểm kê tháng ${d.getMonth()+1}/${d.getFullYear()}`,items:db.assets.filter(x=>x.status!=='DISPOSED').map(x=>({code:x.code,book:1,actual:null}))});save();render();break}
    case 'closeSession': {const s=db.sessions.find(x=>x.open);const left=s.items.filter(i=>i.actual===null).length;
      if(left){toast('Còn '+left+' tài sản chưa được ghi nhận',1);break}
      confirmBox('Đóng phiên kiểm kê','Sau khi đóng, kết quả chênh lệch được lưu và không thể chỉnh sửa.','doClose',{},'Đóng phiên',false);break}
    case 'doClose': {const s=db.sessions.find(x=>x.open);s.open=false;s.items.filter(i=>i.actual===0).forEach(i=>log(byCode(i.code),'Kiểm kê: không tìm thấy ('+s.name+')'));save();closeModal();render();toast('Đã đóng phiên kiểm kê');break}
    case 'reset': confirmBox('Khôi phục dữ liệu mẫu','Mọi thay đổi bạn đã thực hiện trong bản chạy thử sẽ bị xóa.','doReset',{},'Khôi phục');break;
    case 'doReset': db=seed();save();closeModal();render();toast('Đã khôi phục dữ liệu mẫu');break;
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='fq'){filt.q=e.target.value;$('#arows').innerHTML=assetRows()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='fc'){filt.cat=t.value;$('#arows').innerHTML=assetRows()}
  else if(t.id==='fs'){filt.st=t.value;$('#arows').innerHTML=assetRows()}
  else if(t.dataset.ix!==undefined){const s=db.sessions.find(x=>x.open);s.items[t.dataset.ix].actual=t.value===''?null:+t.value;save();render()}
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;
  if(f.id==='loginForm'){
    const u=USERS.find(x=>x.email===$('#em').value.trim());
    if(!u||u.pw!==$('#pw').value){$('#app').innerHTML=loginView('Sai tên đăng nhập hoặc mật khẩu.');return}
    user=u;route=MENU[u.role][0][0];location.hash=route;render();toast('Đăng nhập thành công, vai trò '+ROLES[u.role]);
  }
  else if(f.id==='assetForm'){
    const g=k=>$('#f_'+k)?.value.trim()??'';
    const v={code:g('code'),name:g('name'),cat:g('cat'),date:g('date'),cost:g('cost'),sup:g('sup'),loc:g('loc'),userId:g('userId'),desc:g('desc')};
    const edit=f.dataset.edit, er={};
    if(!v.code)er.code='Mã tài sản là bắt buộc.';
    else if(db.assets.some(a=>a.code===v.code&&a.code!==edit))er.code='Mã tài sản đã tồn tại, hãy dùng mã khác.';
    if(!v.name)er.name='Vui lòng nhập tên tài sản.';
    if(!v.cat)er.cat='Chọn danh mục.';
    if(!v.date)er.date='Chọn ngày mua.';
    if(!(+v.cost>0))er.cost='Giá trị mua phải lớn hơn 0.';
    if(Object.keys(er).length){modal(assetForm(v,er,edit));return}
    if(edit){const a=byCode(edit);Object.assign(a,{name:v.name,cat:v.cat,date:v.date,cost:+v.cost,sup:v.sup,loc:v.loc,desc:v.desc,code:v.code});log(a,'Cập nhật thông tin');toast('Đã lưu thay đổi')}
    else{const a={code:v.code,name:v.name,cat:v.cat,date:v.date,cost:+v.cost,sup:v.sup,loc:v.loc,desc:v.desc,userId:v.userId||null,status:v.userId?'IN_USE':'AVAILABLE',history:[]};
      db.assets.push(a);log(a,'Đăng ký tài sản vào hệ thống');if(v.userId)log(a,'Gán cho '+empName(v.userId));toast('Đã lưu tài sản '+a.code)}
    save();closeModal();render();
  }
  else if(f.id==='empForm'){
    const n=$('#e_name').value.trim(),d=$('#e_dept').value.trim();
    if(!n||!d){$('#e_err').textContent='Nhập họ tên và phòng ban.';return}
    db.employees.push({id:'e'+Date.now(),name:n,dept:d,email:$('#e_mail').value.trim()});save();closeModal();render();toast('Đã thêm nhân viên');
  }
  else if(f.id==='reqForm'){
    const c=$('#rc').value,n=$('#rn').value.trim();
    if(!c||!n){$('#rerr').textContent='Chọn tài sản và mô tả sự cố.';return}
    db.requests.push({id:Date.now(),code:c,by:user.empId,note:n,date:today(),state:'open'});save();render();toast('Đã gửi yêu cầu bảo trì');
  }
});
addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
go();
</script>
